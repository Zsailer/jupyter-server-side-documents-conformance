name: Environments
# Runs the conformance tests against the latest release of each backend, side by side:
#
#   Actions > Environments > Run workflow
#
# Manual only: it never runs on a pull request or a push. It installs whatever is newest on PyPI at the time, so a run
# says how the backends stand today, not how this tree stood when it was written.
#
#   jsd         jupyter-server-documents
#   jcollab     jupyter-collaboration + jupyter-server-nbmodel
#   jupyverse   jupyverse (with its JupyterLab and collaboration plugins)
#
# The three jobs run in parallel and do not cancel one another: a backend that fails does not hide the others.
# Each uploads its results as an artifact named conformance-<environment>, and a last job publishes the Playwright reports
# of all three to GitHub Pages, under /environments/ (the latest run only).
on:
  workflow_dispatch:
    inputs:
      stories:
        description: Stories to run (ids or prefixes, space separated). Empty runs every story.
        type: string
        default: ""
      workers:
        description: Stories to run at once in each environment (every story opens several browsers)
        type: string
        default: "3"

permissions:
  contents: read

env:
  # where the publish job puts the reports (GitHub Pages, the gh-pages branch)
  REPORTS_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/environments

concurrency:
  group: environments-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: jupyter-server-documents
            id: jsd
            packages: jupyterlab jupyter-server-documents
            # the suite starts the server itself, with its own config and side of the control contract
            server: --backend jsd
          - name: jupyter-collaboration + jupyter-server-nbmodel
            id: jcollab
            packages: jupyterlab jupyter-collaboration jupyter-server-nbmodel
            server: --backend jcollab
          - name: jupyverse
            id: jupyverse
            packages: "jupyverse[jupyterlab,noauth,collaboration]"
            # jupyverse is not one of the backends the suite knows how to start, so it is started the way any other is
            # (--start). It has no side of the control contract here: the stories that need the server to be told
            # something are skipped, and the summary says which.
            server: --start "cd $RUNNER_TEMP/root && $RUNNER_TEMP/env/bin/jupyverse --port {port}" --root-dir "$RUNNER_TEMP/root"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: compliance/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the tests
        working-directory: compliance
        run: |
          pip install pyyaml
          npm ci
          # the stories and the tests are generated from stories/, none of it is committed
          npm run generate
          npx playwright install --with-deps chromium
      - name: Install the latest ${{ matrix.name }}
        run: |
          python -m venv "$RUNNER_TEMP/env"
          "$RUNNER_TEMP/env/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/env/bin/pip" install --upgrade ${{ matrix.packages }}
          mkdir -p "$RUNNER_TEMP/root"
          # the versions this run is about, in the log and in the summary
          {
            echo "### ${{ matrix.name }}"
            "$RUNNER_TEMP/env/bin/pip" list --format=freeze | grep -iE '^(jupyterlab|jupyter[-_]server[-_]documents|jupyter[-_]collaboration|jupyter[-_]server[-_]nbmodel|jupyverse|fps[-_]yjs)==' | sed 's/^/- /'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the conformance tests
        env:
          # also keep Playwright's blob report, merged into an HTML report below
          COMPLIANCE_BLOB_DIR: ${{ runner.temp }}/blob
          STORIES: ${{ inputs.stories }}
          WORKERS: ${{ inputs.workers }}
        # the known gaps are the ones recorded for this backend; jupyverse has none yet, so every miss is a real one
        run: |
          gaps="compliance/known-gaps/${{ matrix.id }}.json"
          [ -f "$gaps" ] || gaps=""
          node compliance/bin/conformance.mjs run $STORIES \
            ${{ matrix.server }} \
            --env "$RUNNER_TEMP/env" \
            --workers "$WORKERS" \
            ${gaps:+--known-gaps "$gaps"} \
            --out "conformance-results/${{ matrix.id }}"
      - name: Build the Playwright report
        if: always()
        working-directory: compliance
        env:
          PLAYWRIGHT_HTML_REPORT: ${{ runner.temp }}/report
        run: |
          if [ -d "$RUNNER_TEMP/blob" ]; then
            npx playwright merge-reports --reporter html "$RUNNER_TEMP/blob"
          fi
      - name: Say where the report will be
        if: always()
        run: |
          echo "The report of ${{ matrix.name }} will be at $REPORTS_URL/${{ matrix.id }}/ once the last job has published it"
          echo "Report: $REPORTS_URL/${{ matrix.id }}/ (when the last job has published it)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-${{ matrix.id }}
          path: conformance-results/${{ matrix.id }}
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ matrix.id }}
          path: ${{ runner.temp }}/report
          if-no-files-found: ignore

  # one page for the three reports, replacing the last run's
  publish:
    name: Publish the reports
    needs: conformance
    # also when an environment failed: that is when the report is wanted
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # one publisher at a time, so this and the site do not race for the gh-pages branch
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      # the deploy action pushes from a git repository
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: report-*
          path: site
      - name: Add an index
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cd site
          for dir in report-*; do mv "$dir" "${dir#report-}"; done
          # the page is .github/environments-index.html, with the run filled in
          sed -e "s|__RUN_URL__|$RUN_URL|" -e "s|__SHA__|${GITHUB_SHA::7}|" -e "s|__DATE__|$(date -u '+%-d %B %Y, %H:%M UTC')|" \
            ../.github/environments-index.html > index.html
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: site
          target-folder: environments
          # only this folder is replaced: the site and the pull request previews stay
          clean: true
          force: false
      - name: Link to the reports
        run: |
          echo "::notice title=Conformance reports::$REPORTS_URL/"
          {
            echo "### Playwright reports"
            echo "- [all three]($REPORTS_URL/)"
            for dir in site/*/; do d=$(basename "$dir"); echo "- [$d]($REPORTS_URL/$d/)"; done
            echo
            echo "The page can take a minute to update after the deploy."
          } | tee -a "$GITHUB_STEP_SUMMARY"
