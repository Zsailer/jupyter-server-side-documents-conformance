name: Preview
on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  preview:
    # a pull request from a fork has a read-only token: it can neither push the preview nor comment
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        if: github.event.action != 'closed'
        with:
          python-version: "3.12"
      # the stories of the branch the pull request goes into, to see what the pull request changes
      - name: Fetch the base stories
        if: github.event.action != 'closed'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          git worktree add ../base "${{ github.event.pull_request.base.sha }}"
      # the preview opens on the new and changed stories; with none changed it is the ordinary site
      - name: Build the page
        if: github.event.action != 'closed'
        run: |
          pip install pyyaml
          python3 -I examples/storyboards/build.py --base-data ../base/stories --pr "${{ github.event.pull_request.number }}"
      # deploys examples/storyboards/site to gh-pages/pr-preview/pr-<number>/ and comments the link;
      # on `closed` it removes the folder and updates the comment
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: examples/storyboards/site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
