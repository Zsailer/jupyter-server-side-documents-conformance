name: Release
# Publishes @zsailer/jupyter-server-side-documents-conformance to npm when a version tag is pushed.
#
#   1. Bump the version in a pull request:   npm version minor --no-git-tag-version   (then merge it)
#   2. Tag the merge commit and push the tag:   git tag 0.3.0 && git push origin 0.3.0
#
# Publishing uses npm trusted publishing (OIDC): there is no npm token to store. Set it up once, on npmjs.com, in the
# package's Settings > Trusted Publisher: GitHub Actions, this repository, workflow `release.yml`, environment `npm`.
# (npm only offers that for a package that exists, so the very first version is published by hand.)
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write   # the GitHub release
  id-token: write   # npm trusted publishing and provenance

jobs:
  release:
    runs-on: ubuntu-latest
    # a maintainer approves the publish: add required reviewers to the `npm` environment in the repository settings
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24   # ships an npm that can publish with OIDC
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: npm ci
      - run: npm ci --prefix compliance
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: The tag must be the version in package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - run: npm run check
      - name: Pack
        run: python3 -I compliance/scripts/package.py
      - name: Publish to npm
        run: npm publish dist/*.tgz --access public --provenance
      - name: Publish the GitHub release
        run: gh release create "$GITHUB_REF_NAME" dist/*.tgz --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
