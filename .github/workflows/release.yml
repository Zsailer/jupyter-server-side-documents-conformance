name: Release
# Publishes @zsailer/jupyter-server-side-documents-conformance to npm when a version tag is pushed.
#
#   1. Bump the version in a pull request:   npm version minor --no-git-tag-version   (then merge it)
#   2. Tag the merge commit and push the tag:   git tag 0.3.0 && git push origin 0.3.0
#
# Publishing uses npm trusted publishing (OIDC): there is no npm token to store. Set it up once, on npmjs.com, in the
# package's Settings > Trusted Publisher: GitHub Actions, this repository, workflow `release.yml`, environment `npm`,
# and leave "Allow npm publish" unchecked. The workflow only STAGES the version (`npm stage publish`); a maintainer
# approves it on npmjs.com or with `npm stage approve`, using 2FA, and only then is it public.
# (npm only offers trusted publishing for a package that exists, so the first version is published by hand, and a new
# configuration must complete its first publish within 2 days.)
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write   # the GitHub release
  id-token: write   # npm trusted publishing and provenance

jobs:
  release:
    runs-on: ubuntu-latest
    # a maintainer approves the publish: add required reviewers to the `npm` environment in the repository settings
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Use the latest npm (staged publishing needs a recent one)
        run: npm install -g npm@latest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: npm ci
      - run: npm ci --prefix compliance
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: The tag must be the version in package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - run: npm run check
      - name: Pack
        run: python3 -I compliance/scripts/package.py
      # provenance is added automatically once the repository is public
      - name: Stage the version on npm
        run: npm stage publish dist/*.tgz
      # a draft: publish it after approving the staged version on npm
      - name: Draft the GitHub release
        run: gh release create "$GITHUB_REF_NAME" dist/*.tgz --draft --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
