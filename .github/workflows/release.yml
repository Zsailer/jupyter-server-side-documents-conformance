name: Release
# Publishes @jupyter-ai-contrib/jupyter-server-side-documents-conformance to npm. Started by hand from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      version_part:
        description: How should we bump the version?
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write
  id-token: write   # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    # needs the repository secret NPM_TOKEN (an npm automation token able to publish the scope)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: npm ci
      - run: npm ci --prefix compliance
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Test
        run: npm run check
      - name: Bump the version and pack
        id: version
        run: |
          npm version "${{ inputs.version_part }}" --no-git-tag-version
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          python3 -I compliance/scripts/package.py
      - name: Publish
        run: npm publish dist/*.tgz --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Commit the version and tag it
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Bump to version ${{ steps.version.outputs.version }}"
          git tag "${{ steps.version.outputs.version }}"
          git push origin HEAD:main "${{ steps.version.outputs.version }}"
